<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Desarrollo de asistentes de IA con RAG, agentes y MCP</title>
  <desc id="desc">Banner del curso de InterSystems IRIS y AI Hub: evidencia, capacidades y conexión.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17164e"/>
      <stop offset="0.6" stop-color="#302b91"/>
      <stop offset="1" stop-color="#1f6fae"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#bfeef0" stroke-opacity=".14"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="440" rx="18" fill="url(#background)"/>
  <rect width="1440" height="440" rx="18" fill="url(#grid)"/>
  <rect x="0" width="18" height="440" rx="9" fill="#00a99d"/>

  <text x="82" y="83" fill="#8ff2e7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4">INTERSYSTEMS IRIS · AI HUB</text>
  <text x="82" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700">Desarrollo de asistentes de IA</text>
  <text x="82" y="239" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700">con RAG, agentes y MCP</text>
  <text x="84" y="304" fill="#d7e9ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic">Evidencia documental · capacidades gobernadas · conexiones MCP</text>
  <rect x="82" y="347" width="630" height="2" fill="#00c2b1" opacity=".8"/>
  <text x="82" y="389" fill="#8ff2e7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONOCIMIENTO · ACCIÓN · CONEXIÓN</text>

  <g fill="none" stroke="#78e7dc" stroke-width="4" stroke-linecap="round" opacity=".9" filter="url(#glow)">
    <path d="M1000 150 L1210 252 L1080 348 Z"/>
  </g>
  <g fill="#3a3790" stroke="#d6e8ff" stroke-opacity=".72" stroke-width="2">
    <circle cx="1000" cy="150" r="67"/>
    <circle cx="1210" cy="252" r="67"/>
    <circle cx="1080" cy="348" r="67"/>
  </g>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="1000" y="146" fill="#ffffff" font-size="30" font-weight="700">RAG</text>
    <text x="1000" y="174" fill="#8ff2e7" font-size="13" font-weight="700" letter-spacing="2">EVIDENCIA</text>
    <text x="1210" y="248" fill="#ffffff" font-size="27" font-weight="700">Agentes</text>
    <text x="1210" y="276" fill="#8ff2e7" font-size="13" font-weight="700" letter-spacing="2">CAPACIDADES</text>
    <text x="1080" y="344" fill="#ffffff" font-size="30" font-weight="700">MCP</text>
    <text x="1080" y="372" fill="#8ff2e7" font-size="13" font-weight="700" letter-spacing="2">CONEXIÓN</text>
  </g>
</svg>
